[package]
name = "pio-tui"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A fast, friendly TUI for PlatformIO: scaffold projects and generate compile_commands.json"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.28"
ctrlc = "3.5.2"
dirs = "7.0.0"
fuzzy-matcher = "0.3.7"
ratatui = "0.29"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
unicode-segmentation = "1"
unicode-width = "0.2"
ureq = { version = "2", features = ["json"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

[target."cfg(unix)".dependencies]
libc = "0.2.191"
